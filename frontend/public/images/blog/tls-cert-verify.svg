<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  <marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4338ca"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">How your browser checks a certificate</text>
<text x="40" y="82" font-size="16" fill="#71717a">It re-hashes the data and checks the signature using the CA's public key, which it already has and trusts.</text>
<rect x="40" y="120" width="300" height="225" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<path d="M40 160 V134 a14 14 0 0 1 14 -14 H326 a14 14 0 0 1 14 14 V160 Z" fill="#0f766e"/>
<text x="58" y="147" font-size="16" font-weight="700" fill="#fff">📜 jim.com certificate</text>
<rect x="60" y="175" width="260" height="80" rx="10" fill="#f4f4f5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#18181b"><text x="76" y="203">data: subject, key,</text><text x="76" y="225">issuer, validity…</text></g>
<rect x="60" y="270" width="260" height="56" rx="10" fill="#e0e7ff"/>
<text x="76" y="304" font-size="15" fill="#18181b">✍️ CA's signature</text>
<g text-anchor="middle" font-size="15" fill="#18181b">
  <line x1="320" y1="215" x2="426" y2="215" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/><text x="373" y="203" font-size="12" font-family="JetBrains Mono, Consolas, monospace">SHA-256</text>
  <rect x="430" y="185" width="220" height="60" rx="12" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="540" y="221" font-family="JetBrains Mono, Consolas, monospace">hash: 9f2c…</text>
  <line x1="320" y1="298" x2="426" y2="298" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="430" y="268" width="220" height="60" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="540" y="304">🔓 CA's public key</text>
  <rect x="430" y="350" width="220" height="34" rx="17" fill="#fef3c7"/><text x="540" y="372" font-size="13">📦 from your trust store</text>
  <line x1="540" y1="350" x2="540" y2="332" stroke="#d97706" stroke-width="2" marker-end="url(#a)"/>
  <rect x="740" y="200" width="180" height="110" rx="14" fill="#fff" stroke="#18181b" stroke-width="2"/>
  <text x="830" y="248" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">verify()</text><text x="830" y="274" font-size="13" fill="#71717a">signature matches?</text>
  <path d="M650 215 L736 238" stroke="#52525b" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M650 298 L736 275" stroke="#52525b" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <rect x="990" y="200" width="170" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1075" y="244" font-size="18" font-weight="700" fill="#0f766e">✅ valid</text><text x="1075" y="268" font-size="13" fill="#18181b">this CA signed</text><text x="1075" y="287" font-size="13" fill="#18181b">exactly this data</text>
  <line x1="920" y1="255" x2="986" y2="255" stroke="#0f766e" stroke-width="2.5" marker-end="url(#t)"/>
</g>
<rect x="40" y="410" width="1120" height="200" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="70" y="448" font-size="18" font-weight="700" fill="#18181b">The connection is trusted only if ALL of these pass:</text>
<g font-size="16" fill="#18181b">
  <text x="70" y="488">✅ The signature is valid (above)</text>
  <text x="70" y="526">✅ It's signed by a CA your device trusts</text>
  <text x="70" y="564">✅ The domain matches the site you opened</text>
  <text x="620" y="488">✅ It isn't expired</text>
  <text x="620" y="526">✅ It hasn't been revoked</text>
  <text x="620" y="564" font-weight="700" fill="#0f766e">✅ The server proves it owns the private key</text>
</g>
</svg>
