<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  <marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4338ca"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Hybrid encryption: asymmetric once, symmetric for everything else</text>
<text x="40" y="82" font-size="16" fill="#71717a">Public-key crypto is slow, so it's only used to share a small random session key. AES does the heavy lifting.</text>
<rect x="40" y="110" width="1120" height="180" rx="16" fill="#eef2ff"/>
<text x="60" y="142" font-size="18" font-weight="700" fill="#4338ca">① Share a session key (slow, done once)</text>
<g text-anchor="middle">
  <rect x="60" y="165" width="200" height="100" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="160" y="205" font-size="20" font-weight="700" fill="#18181b">👩‍💻 Pam</text><text x="160" y="235" font-size="14" fill="#71717a">makes a random</text><text x="160" y="253" font-size="14" fill="#71717a">session key 🎲</text>
  <rect x="940" y="165" width="200" height="100" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="1040" y="205" font-size="20" font-weight="700" fill="#18181b">🖥️ Jim</text><text x="1040" y="235" font-size="14" fill="#71717a">unlocks it with</text><text x="1040" y="253" font-size="14" fill="#71717a">his private 🔑</text>
</g>
<line x1="260" y1="215" x2="936" y2="215" stroke="#4338ca" stroke-width="3" marker-end="url(#i)"/>
<rect x="420" y="190" width="360" height="50" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="600" y="221" text-anchor="middle" font-size="16" fill="#18181b">🎲 session key, locked with Jim's 🔓</text>
<rect x="40" y="310" width="1120" height="160" rx="16" fill="#f0fdfa"/>
<text x="60" y="342" font-size="18" font-weight="700" fill="#0f766e">② Talk using the session key (fast, every message)</text>
<g text-anchor="middle">
  <rect x="60" y="360" width="200" height="90" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="160" y="397" font-size="20" font-weight="700" fill="#18181b">👩‍💻 Pam</text><text x="160" y="425" font-size="14" fill="#71717a">has 🎲</text>
  <rect x="940" y="360" width="200" height="90" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="1040" y="397" font-size="20" font-weight="700" fill="#18181b">🖥️ Jim</text><text x="1040" y="425" font-size="14" fill="#71717a">has 🎲</text>
  <text x="600" y="383" font-size="15" fill="#18181b"><tspan font-family="JetBrains Mono, Consolas, monospace">GET /inbox</tspan>, encrypted with AES + 🎲</text>
  <line x1="260" y1="394" x2="936" y2="394" stroke="#0f766e" stroke-width="3" marker-end="url(#t)"/>
  <text x="600" y="420" font-size="15" fill="#18181b"><tspan font-family="JetBrains Mono, Consolas, monospace">200 OK</tspan>, encrypted with the same 🎲</text>
  <line x1="940" y1="432" x2="264" y2="432" stroke="#0f766e" stroke-width="3" marker-end="url(#t)"/>
</g>
<rect x="40" y="490" width="1120" height="50" rx="14" fill="#18181b"/>
<text x="600" y="522" text-anchor="middle" font-size="17" fill="#fff">The slow part happens only once. Everything after that is fast.</text>
</svg>
