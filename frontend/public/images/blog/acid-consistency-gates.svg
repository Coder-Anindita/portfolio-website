<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Consistency has two security guards</text>
<text x="40" y="82" font-size="16" fill="#71717a">Bad data has to get past the application AND the database before it's stored.</text>

<!-- incoming -->
<rect x="40" y="130" width="200" height="300" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="140" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#18181b">📥 Incoming</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#18181b">
  <text x="60" y="215">amount = 50000</text>
  <text x="60" y="250">balance = -500</text>
  <text x="60" y="285">email = NULL</text>
  <text x="60" y="320">id = 1 (again)</text>
  <text x="60" y="355">age = 'abc'</text>
  <text x="60" y="390">branch = 999</text>
</g>

<!-- gate 1 -->
<rect x="300" y="110" width="380" height="340" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="490" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">🧑‍💻 Guard 1: Application layer</text>
<text x="490" y="176" text-anchor="middle" font-size="15" fill="#71717a">business rules the DB can't know</text>
<g font-size="16" fill="#18181b">
  <text x="325" y="220">❌ amount over daily UPI limit</text>
  <text x="325" y="252">❌ KYC not completed</text>
  <text x="325" y="284">❌ "can't transfer to yourself"</text>
  <text x="325" y="316">✅ friendly error messages</text>
  <text x="325" y="348">✅ checks before hitting the DB</text>
  <text x="325" y="400" font-size="14" fill="#b45309" font-weight="600">Can be bypassed by bugs, scripts,</text>
  <text x="325" y="420" font-size="14" fill="#b45309" font-weight="600">or another service writing directly.</text>
</g>

<!-- gate 2 -->
<rect x="720" y="110" width="440" height="340" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="940" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">🗄️ Guard 2: Database rules</text>
<text x="940" y="176" text-anchor="middle" font-size="15" fill="#71717a">enforced on every write, no exceptions</text>
<g font-size="16" fill="#18181b">
  <text x="745" y="220"><tspan font-weight="700">CHECK</tspan><tspan x="880">balance = -500 ❌</tspan></text>
  <text x="745" y="252"><tspan font-weight="700">NOT NULL</tspan><tspan x="880">email = NULL ❌</tspan></text>
  <text x="745" y="284"><tspan font-weight="700">PRIMARY KEY</tspan><tspan x="880">duplicate id ❌</tspan></text>
  <text x="745" y="316"><tspan font-weight="700">UNIQUE</tspan><tspan x="880">same PAN twice ❌</tspan></text>
  <text x="745" y="348"><tspan font-weight="700">Data type</tspan><tspan x="880">age = 'abc' ❌</tspan></text>
  <text x="745" y="380"><tspan font-weight="700">FOREIGN KEY</tspan><tspan x="880">branch 999 missing ❌</tspan></text>
  <text x="745" y="420" font-size="14" fill="#0f766e" font-weight="600">The last line of defence. Violations abort the transaction.</text>
</g>

<g stroke="#52525b" stroke-width="2.5" fill="none" marker-end="url(#a)">
  <line x1="244" y1="280" x2="292" y2="280"/>
  <line x1="684" y1="280" x2="712" y2="280"/>
  <path d="M940 455 L940 495"/>
</g>

<rect x="720" y="505" width="440" height="100" rx="16" fill="#0f766e"/>
<text x="940" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">✅ Stored: valid data only</text>
<text x="940" y="580" text-anchor="middle" font-size="16" fill="#ccfbf1">one valid state → another valid state</text>

<rect x="40" y="505" width="640" height="100" rx="16" fill="#fff" stroke="#e4e4e7"/>
<text x="65" y="545" font-size="17" font-weight="700" fill="#18181b">Rule of thumb</text>
<text x="65" y="575" font-size="16" fill="#52525b">Validate in the app for UX. Enforce in the DB for truth.</text>
</svg>
