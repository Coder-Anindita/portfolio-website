<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  <marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4338ca"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Symmetric encryption: one key locks and unlocks</text>
<text x="40" y="82" font-size="16" fill="#71717a">Fast and strong (e.g. AES), but both sides need the same key. Getting it there safely is the hard part.</text>
<text x="40" y="130" font-size="18" font-weight="700" fill="#0f766e">✅ Encrypting works</text>
<g text-anchor="middle" font-size="17">
  <rect x="40" y="150" width="180" height="70" rx="12" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="130" y="191" fill="#18181b">Hi Jim 👋</text>
  <rect x="330" y="150" width="200" height="70" rx="12" fill="#f4f4f5" stroke="#d6d3d1" stroke-width="2"/><text x="430" y="191" font-family="JetBrains Mono, Consolas, monospace" fill="#52525b">x7#Lq9!vR</text>
  <rect x="670" y="150" width="200" height="70" rx="12" fill="#f4f4f5" stroke="#d6d3d1" stroke-width="2"/><text x="770" y="191" font-family="JetBrains Mono, Consolas, monospace" fill="#52525b">x7#Lq9!vR</text>
  <rect x="980" y="150" width="180" height="70" rx="12" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="1070" y="191" fill="#18181b">Hi Jim 👋</text>
</g>
<g font-size="14" text-anchor="middle" fill="#18181b">
  <line x1="220" y1="185" x2="326" y2="185" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/><text x="275" y="172">🔑 encrypt</text>
  <line x1="530" y1="185" x2="666" y2="185" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="172" fill="#71717a">internet</text>
  <line x1="870" y1="185" x2="976" y2="185" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/><text x="925" y="172">🔑 decrypt</text>
</g>
<text x="40" y="255" font-size="15" fill="#71717a">The same key 🔑 on both sides. Without it, the ciphertext is gibberish.</text>
<text x="40" y="320" font-size="18" font-weight="700" fill="#e11d48">❌ Sharing the key doesn't</text>
<g text-anchor="middle">
  <rect x="40" y="340" width="200" height="90" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="140" y="380" font-size="20" font-weight="700" fill="#18181b">👩‍💻 Pam</text><text x="140" y="406" font-size="14" fill="#71717a">has the key 🔑</text>
  <rect x="960" y="340" width="200" height="90" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="1060" y="380" font-size="20" font-weight="700" fill="#18181b">🖥️ Jim</text><text x="1060" y="406" font-size="14" fill="#71717a">needs the key</text>
</g>
<line x1="240" y1="385" x2="956" y2="385" stroke="#52525b" stroke-width="3" marker-end="url(#a)"/>
<rect x="470" y="360" width="260" height="50" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="600" y="391" text-anchor="middle" font-size="16" fill="#18181b">🔑 “here's the key”</text>
<line x1="600" y1="410" x2="600" y2="466" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="500" y="468" width="200" height="72" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="600" y="499" text-anchor="middle" font-size="20" font-weight="700" fill="#18181b">🕵️ Hacker</text>
<text x="600" y="524" text-anchor="middle" font-size="14" fill="#71717a">copies the key</text>
<text x="720" y="510" font-size="16" font-weight="600" fill="#e11d48">Now they can decrypt everything. 🔓</text>
</svg>
