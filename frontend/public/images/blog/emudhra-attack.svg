<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">How an attacker could have abused these keys</text>
<text x="40" y="82" font-size="16" fill="#71717a">A hypothetical example. No real attack using these keys has been reported.</text>
<rect x="60" y="115" width="255" height="210" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="82" y="160" font-size="30">🔢</text><text x="82" y="200" font-size="17" font-weight="700" fill="#18181b">① Recover the key</text><text x="82" y="235" font-size="15" fill="#52525b">Try 1, 2, 3… until one</text><text x="82" y="259" font-size="15" fill="#52525b">matches the public</text><text x="82" y="283" font-size="15" fill="#52525b">certificate</text><line x1="317" y1="220" x2="333" y2="220" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/><rect x="335" y="115" width="255" height="210" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="357" y="160" font-size="30">✍️</text><text x="357" y="200" font-size="17" font-weight="700" fill="#18181b">② Forge a certificate</text><text x="357" y="235" font-size="15" fill="#52525b">For mybank.example,</text><text x="357" y="259" font-size="15" fill="#52525b">signed with the weak</text><text x="357" y="283" font-size="15" fill="#52525b">intermediate key</text><line x1="592" y1="220" x2="608" y2="220" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/><rect x="610" y="115" width="255" height="210" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="632" y="160" font-size="30">📡</text><text x="632" y="200" font-size="17" font-weight="700" fill="#18181b">③ Redirect the victim</text><text x="632" y="235" font-size="15" fill="#52525b">E.g. a fake Wi-Fi</text><text x="632" y="259" font-size="15" fill="#52525b">hotspot or tampered</text><text x="632" y="283" font-size="15" fill="#52525b">DNS</text><line x1="867" y1="220" x2="883" y2="220" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/><rect x="885" y="115" width="255" height="210" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="907" y="160" font-size="30">🔒</text><text x="907" y="200" font-size="17" font-weight="700" fill="#18181b">④ Victim sees a padlock</text><text x="907" y="235" font-size="15" fill="#52525b">The browser trusts the</text><text x="907" y="259" font-size="15" fill="#52525b">chain, but the server</text><text x="907" y="283" font-size="15" fill="#52525b">is the attacker's</text>
<rect x="60" y="350" width="530" height="130" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="82" y="388" font-size="17" font-weight="700" fill="#e11d48">⚠️ What it made possible</text>
<text x="82" y="420" font-size="15" fill="#18181b">Pretending to be any website, to a victim who</text>
<text x="82" y="443" font-size="15" fill="#18181b">has been redirected to the attacker's server.</text>
<rect x="610" y="350" width="530" height="130" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="632" y="388" font-size="17" font-weight="700" fill="#0f766e">✅ What it did NOT do</text>
<text x="632" y="420" font-size="15" fill="#18181b">Decrypt everyone's traffic, or reveal the private</text>
<text x="632" y="443" font-size="15" fill="#18181b">keys of real websites like your bank.</text>
</svg>
