<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#fafaf9"/>
<!-- terminal window -->
<rect x="30" y="30" width="1140" height="370" rx="14" fill="#0c0a09"/>
<rect x="30" y="30" width="1140" height="40" rx="14" fill="#292524"/><rect x="30" y="56" width="1140" height="14" fill="#292524"/>
<circle cx="58" cy="50" r="7" fill="#ef4444"/><circle cx="82" cy="50" r="7" fill="#f59e0b"/><circle cx="106" cy="50" r="7" fill="#22c55e"/>
<text x="600" y="56" text-anchor="middle" font-size="15" fill="#a8a29e">postgres@db-01: ~ — pg_waldump</text>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14.5" xml:space="preserve" style="white-space:pre">
  <text x="52" y="108" fill="#a3e635">$ <tspan fill="#e7e5e4">pg_waldump $PGDATA/pg_wal/000000010000000000000001 --start=0/01A2B3C8</tspan></text>

  <text x="52" y="148" fill="#e7e5e4"><tspan fill="#7dd3fc">rmgr: Heap       </tspan> len (rec/tot): 72/72, <tspan fill="#fbbf24">tx: 735</tspan>, <tspan fill="#c4b5fd">lsn: 0/01A2B3C8</tspan>, prev 0/01A2B390, desc: <tspan fill="#86efac">HOT_UPDATE</tspan> old_off: 1, new_off: 3,</text>
  <text x="230" y="170" fill="#78716c">blkref #0: rel 1663/16384/16385 blk 0</text>
  <text x="52" y="200" fill="#e7e5e4"><tspan fill="#7dd3fc">rmgr: Heap       </tspan> len (rec/tot): 72/72, <tspan fill="#fbbf24">tx: 735</tspan>, <tspan fill="#c4b5fd">lsn: 0/01A2B410</tspan>, prev 0/01A2B3C8, desc: <tspan fill="#86efac">HOT_UPDATE</tspan> old_off: 2, new_off: 4,</text>
  <text x="230" y="222" fill="#78716c">blkref #0: rel 1663/16384/16385 blk 0</text>
  <text x="52" y="252" fill="#e7e5e4"><tspan fill="#7dd3fc">rmgr: Transaction</tspan> len (rec/tot): 34/34, <tspan fill="#fbbf24">tx: 735</tspan>, <tspan fill="#c4b5fd">lsn: 0/01A2B458</tspan>, prev 0/01A2B410, desc: <tspan fill="#4ade80" font-weight="700">COMMIT</tspan> 2026-10-23 10:15:42.318 IST</text>

  <text x="52" y="292" fill="#e7e5e4"><tspan fill="#7dd3fc">rmgr: Heap       </tspan> len (rec/tot): 72/72, <tspan fill="#fb7185">tx: 736</tspan>, <tspan fill="#c4b5fd">lsn: 0/01A2B480</tspan>, prev 0/01A2B458, desc: <tspan fill="#86efac">HOT_UPDATE</tspan> old_off: 3, new_off: 5,</text>
  <text x="230" y="314" fill="#78716c">blkref #0: rel 1663/16384/16385 blk 0</text>
  <text x="52" y="344" fill="#e7e5e4"><tspan fill="#7dd3fc">rmgr: Transaction</tspan> len (rec/tot): 34/34, <tspan fill="#fb7185">tx: 736</tspan>, <tspan fill="#c4b5fd">lsn: 0/01A2B4C8</tspan>, prev 0/01A2B480, desc: <tspan fill="#fb7185" font-weight="700">ABORT</tspan> 2026-10-23 10:15:47.902 IST</text>
  <text x="52" y="380" fill="#a3e635">$ <tspan fill="#e7e5e4">▍</tspan></text>
</g>

<!-- legend -->
<g font-size="16">
  <rect x="30" y="425" width="555" height="205" rx="14" fill="#fff" stroke="#e4e4e7"/>
  <text x="54" y="460" font-weight="700" fill="#0369a1">rmgr</text><text x="160" y="460" fill="#18181b">which part of the DB wrote it (Heap = table rows)</text>
  <text x="54" y="495" font-weight="700" fill="#b45309">tx</text><text x="160" y="495" fill="#18181b">transaction ID — both updates share tx 735</text>
  <text x="54" y="530" font-weight="700" fill="#6d28d9">lsn</text><text x="160" y="530" fill="#18181b">Log Sequence Number: the record's position,</text>
  <text x="160" y="553" fill="#18181b">always increasing</text>
  <text x="54" y="590" font-weight="700" fill="#15803d">desc</text><text x="160" y="590" fill="#18181b">what changed (row moved from slot 1 → 3)</text>

  <rect x="615" y="425" width="555" height="205" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="639" y="460" font-weight="700" fill="#0f766e">How to read the story</text>
  <text x="639" y="495" fill="#18181b">tx 735 updated two rows (A and B), then wrote a</text>
  <text x="639" y="518" fill="#18181b"><tspan font-weight="700">COMMIT</tspan> record. That record is the moment it became real.</text>
  <text x="639" y="553" fill="#18181b">tx 736 changed a row, then hit <tspan font-weight="700">ABORT</tspan> (rollback).</text>
  <text x="639" y="576" fill="#18181b">Its change stays in the log but is never visible,</text>
  <text x="639" y="599" fill="#18181b">because 736 has no COMMIT.</text>
</g>
</svg>
