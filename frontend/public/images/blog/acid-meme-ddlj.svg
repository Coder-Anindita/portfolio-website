<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#18181b"/>
<text x="600" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">Server crashes halfway through a transfer:</text>

<rect x="30" y="100" width="560" height="490" rx="14" fill="#fff1f2"/>
<g text-anchor="middle">
  <text x="310" y="160" font-size="24" font-weight="700" fill="#18181b">👩‍💻 The developer</text>
  <text x="310" y="196" font-size="18" font-style="italic" fill="#52525b">*2 AM, sees the half-finished transfer*</text>
  <text x="310" y="370" font-size="140">😱</text>
  <text x="310" y="440" font-size="20" fill="#52525b">"Paise kahaan gaye?? Kaun refund karega??"</text>
  <rect x="80" y="490" width="460" height="64" rx="12" fill="#e11d48"/>
  <text x="310" y="531" font-size="22" font-weight="700" fill="#fff">PANIC MODE</text>
</g>

<rect x="610" y="100" width="560" height="490" rx="14" fill="#ecfdf5"/>
<g text-anchor="middle">
  <text x="890" y="160" font-size="24" font-weight="700" fill="#18181b">🗄️ The database, on restart</text>
  <text x="890" y="196" font-size="18" font-style="italic" fill="#52525b">*calmly reads the log, undoes the debit*</text>
  <text x="890" y="320" font-size="110">😌</text>
  <text x="890" y="390" font-size="21" font-weight="600" fill="#18181b">"Bade bade deshon mein aisi</text>
  <text x="890" y="420" font-size="21" font-weight="600" fill="#18181b">choti choti baatein hoti rehti hain,</text>
  <text x="890" y="450" font-size="21" font-weight="600" fill="#18181b">Senorita."</text>
  <rect x="660" y="490" width="460" height="64" rx="12" fill="#0f766e"/>
  <text x="890" y="531" font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="700" fill="#fff">ROLLBACK; ↩️ all good</text>
</g>
</svg>
