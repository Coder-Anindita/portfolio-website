<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  <marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4338ca"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Man-in-the-middle: the hacker swaps the keys</text>
<text x="40" y="82" font-size="16" fill="#71717a">Pam asks for Jim's public key. The hacker intercepts it and hands Pam their own key instead.</text>
<g text-anchor="middle">
  <rect x="40" y="150" width="220" height="140" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="150" y="215" font-size="20" font-weight="700" fill="#18181b">👩‍💻 Pam</text><text x="150" y="243" font-size="14" fill="#71717a">browser</text>
  <rect x="490" y="150" width="220" height="140" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="600" y="215" font-size="20" font-weight="700" fill="#18181b">🕵️ Hacker</text><text x="600" y="243" font-size="14" fill="#71717a">in the middle</text>
  <rect x="940" y="150" width="220" height="140" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/><text x="1050" y="215" font-size="20" font-weight="700" fill="#18181b">🖥️ Jim</text><text x="1050" y="243" font-size="14" fill="#71717a">server</text>
</g>
<g font-size="14" text-anchor="middle">
  <text x="825" y="180" fill="#0f766e" font-weight="600">① Jim's 🔓</text>
  <line x1="940" y1="192" x2="714" y2="192" stroke="#0f766e" stroke-width="2.5" marker-end="url(#t)"/>
  <text x="375" y="180" fill="#e11d48" font-weight="600">② Hacker's 🔓 “I'm Jim”</text>
  <line x1="490" y1="192" x2="264" y2="192" stroke="#e11d48" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="375" y="240" fill="#18181b">③ 🔒 locked with hacker's key</text>
  <line x1="260" y1="252" x2="486" y2="252" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="825" y="240" fill="#18181b">④ 🔒 re-locked with Jim's key</text>
  <line x1="710" y1="252" x2="936" y2="252" stroke="#52525b" stroke-width="2.5" marker-end="url(#a)"/>
</g>
<text x="600" y="325" text-anchor="middle" font-size="16" font-weight="600" fill="#e11d48">The hacker unlocks, reads 👀, maybe edits ✏️, then re-locks and forwards.</text>
<rect x="40" y="355" width="540" height="100" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="60" y="393" font-size="17" font-weight="700" fill="#18181b">Pam thinks:</text>
<text x="60" y="423" font-size="16" fill="#18181b">“I'm talking to Jim, and it's encrypted ✅”</text>
<rect x="620" y="355" width="540" height="100" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="640" y="393" font-size="17" font-weight="700" fill="#18181b">Jim thinks:</text>
<text x="640" y="423" font-size="16" fill="#18181b">“I'm talking to Pam, and it's encrypted ✅”</text>
<rect x="40" y="485" width="1120" height="90" rx="14" fill="#18181b"/>
<text x="600" y="522" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">The encryption works perfectly. It's just with the wrong person.</text>
<text x="600" y="551" text-anchor="middle" font-size="16" fill="#a1a1aa">A public key is only a big number. Nothing in it says who it belongs to.</text>
</svg>
