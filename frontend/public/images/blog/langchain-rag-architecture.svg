<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="600" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#18181b">PDFBuddy — the full architecture</text>

<g font-size="15" font-weight="700" letter-spacing="2">
  <text x="20" y="102" fill="#0f766e">① INGESTION · runs once per PDF</text>
  <text x="20" y="316" fill="#b45309">② QUERY · runs on every question</text>
  <text x="20" y="546" fill="#4338ca">③ ANSWER</text>
</g>

<!-- row 1: ingestion -->
<g text-anchor="middle">
  <rect x="20" y="120" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="105" y="168" font-size="32">📄</text><text x="105" y="206" font-size="18" font-weight="600" fill="#18181b">PDF upload</text><text x="105" y="228" font-size="13" fill="#71717a">user drops a file</text>
  <rect x="218" y="120" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="303" y="168" font-size="32">☁️</text><text x="303" y="206" font-size="18" font-weight="600" fill="#18181b">AWS S3</text><text x="303" y="228" font-size="13" fill="#71717a">stores the raw file</text>
  <rect x="416" y="120" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="501" y="168" font-size="32">📥</text><text x="501" y="206" font-size="18" font-weight="600" fill="#18181b">Doc loader</text><text x="501" y="228" font-size="13" fill="#71717a">PDF → plain text</text>
  <rect x="614" y="120" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="699" y="168" font-size="32">✂️</text><text x="699" y="206" font-size="18" font-weight="600" fill="#18181b">Text splitter</text><text x="699" y="228" font-size="13" fill="#71717a">text → small chunks</text>
  <rect x="812" y="120" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="897" y="168" font-size="32">🔢</text><text x="897" y="206" font-size="18" font-weight="600" fill="#18181b">Embedding model</text><text x="897" y="228" font-size="13" fill="#71717a">chunk → vector</text>
</g>

<!-- vector db -->
<g text-anchor="middle">
  <path d="M1010 160 v270 a85 18 0 0 0 170 0 v-270" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <ellipse cx="1095" cy="160" rx="85" ry="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1095" y="270" font-size="40">🗄️</text>
  <text x="1095" y="312" font-size="20" font-weight="700" fill="#18181b">Vector DB</text>
  <text x="1095" y="338" font-size="13" fill="#71717a">FAISS · Chroma</text>
  <text x="1095" y="356" font-size="13" fill="#71717a">Pinecone · pgvector</text>
</g>

<!-- row 2: query -->
<g text-anchor="middle">
  <rect x="20" y="330" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="105" y="378" font-size="32">🙋</text><text x="105" y="416" font-size="18" font-weight="600" fill="#18181b">User query</text><text x="105" y="438" font-size="13" fill="#71717a">"What is Newton's 2nd law?"</text>
  <rect x="416" y="330" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="501" y="378" font-size="32">🔢</text><text x="501" y="416" font-size="18" font-weight="600" fill="#18181b">Embedding model</text><text x="501" y="438" font-size="13" fill="#71717a">query → vector</text>
  <rect x="812" y="330" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="897" y="378" font-size="32">🔍</text><text x="897" y="416" font-size="18" font-weight="600" fill="#18181b">Semantic search</text><text x="897" y="438" font-size="13" fill="#71717a">find the nearest chunks</text>
</g>
<text x="501" y="474" text-anchor="middle" font-size="13" font-style="italic" fill="#b45309">same model used during ingestion!</text>

<!-- row 3: answer -->
<g text-anchor="middle">
  <rect x="812" y="560" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="897" y="608" font-size="32">🧾</text><text x="897" y="646" font-size="18" font-weight="600" fill="#18181b">System query</text><text x="897" y="668" font-size="13" fill="#71717a">top chunks + question</text>
  <rect x="416" y="560" width="170" height="120" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="501" y="608" font-size="32">🧠</text><text x="501" y="646" font-size="18" font-weight="600" fill="#18181b">Brain (LLM)</text><text x="501" y="668" font-size="13" fill="#71717a">NLU + text generation</text>
  <rect x="20" y="560" width="170" height="120" rx="14" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="105" y="608" font-size="32">💬</text><text x="105" y="646" font-size="18" font-weight="600" fill="#18181b">Final answer</text><text x="105" y="668" font-size="13" fill="#71717a">grounded in your PDF</text>
</g>

<!-- flowing arrows -->
<g stroke="#0f766e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)">
  <animate attributeName="stroke-dashoffset" values="28;0" dur="0.8s" repeatCount="indefinite"/>
  <line x1="192" y1="180" x2="212" y2="180"/>
  <line x1="390" y1="180" x2="410" y2="180"/>
  <line x1="588" y1="180" x2="608" y2="180"/>
  <line x1="786" y1="180" x2="806" y2="180"/>
  <line x1="984" y1="180" x2="1004" y2="180"/>
  <line x1="194" y1="390" x2="410" y2="390"/>
  <line x1="590" y1="390" x2="806" y2="390"/>
  <line x1="988" y1="390" x2="1004" y2="390" marker-start="url(#a)"/>
  <line x1="897" y1="454" x2="897" y2="554"/>
  <line x1="808" y1="620" x2="592" y2="620"/>
  <line x1="412" y1="620" x2="196" y2="620"/>
</g>
</svg>
