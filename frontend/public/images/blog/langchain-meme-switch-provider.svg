<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#18181b"/>
<text x="600" y="60" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">Manager: "Let's switch from Gemini to OpenAI by Friday."</text>

<rect x="30" y="95" width="560" height="475" rx="14" fill="#fff1f2"/>
<g text-anchor="middle">
  <text x="310" y="145" font-size="24" font-weight="700" fill="#18181b">Me, without LangChain</text>
  <text x="310" y="290" font-size="120">😭</text>
  <text x="310" y="360" font-size="18" fill="#3f3f46">rewrites the SDK client, request format,</text>
  <text x="310" y="388" font-size="18" fill="#3f3f46">response parsing, retries, streaming…</text>
  <text x="310" y="416" font-size="18" fill="#3f3f46">in 14 different files</text>
  <rect x="80" y="470" width="460" height="64" rx="12" fill="#e11d48"/>
  <text x="310" y="511" font-size="22" font-weight="700" fill="#fff">Weekend: cancelled</text>
</g>

<rect x="610" y="95" width="560" height="475" rx="14" fill="#ecfdf5"/>
<g text-anchor="middle">
  <text x="890" y="145" font-size="24" font-weight="700" fill="#18181b">Me, with LangChain</text>
  <text x="890" y="290" font-size="120">😎☕</text>
</g>
<rect x="645" y="330" width="490" height="96" rx="10" fill="#18181b"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14">
  <text x="663" y="368" fill="#fda4af">- init_chat_model("google_genai:gemini-2.5-flash")</text>
  <text x="663" y="400" fill="#86efac">+ init_chat_model("openai:gpt-4o-mini")</text>
</g>
<rect x="660" y="470" width="460" height="64" rx="12" fill="#0f766e"/>
<text x="890" y="511" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">One line. Done by lunch.</text>
</svg>
