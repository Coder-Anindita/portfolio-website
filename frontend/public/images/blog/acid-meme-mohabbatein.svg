<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#18181b"/>
<text x="600" y="62" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">Database constraints when you try to save balance = -500:</text>

<rect x="30" y="100" width="1140" height="300" rx="14" fill="#fffbeb"/>
<g text-anchor="middle">
  <text x="230" y="300" font-size="150">🧔🏻‍♂️</text>
  <text x="720" y="200" font-size="54" font-weight="800" fill="#18181b">"Parampara.</text>
  <text x="720" y="270" font-size="54" font-weight="800" fill="#18181b">Pratishtha.</text>
  <text x="720" y="340" font-size="54" font-weight="800" fill="#b45309">Anushasan."</text>
</g>

<rect x="30" y="420" width="1140" height="150" rx="14" fill="#0c0a09"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="20">
  <text x="60" y="465" fill="#a8a29e">CHECK (balance &gt;= 0)  ·  NOT NULL  ·  UNIQUE  ·  PRIMARY KEY</text>
  <text x="60" y="505" fill="#fb7185">ERROR:  new row for relation "accounts" violates check</text>
  <text x="60" y="535" fill="#fb7185">        constraint "accounts_balance_check"</text>
</g>
</svg>
