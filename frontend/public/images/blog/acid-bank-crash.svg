<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8a29e"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Transfer ₹1000 from A to B… without a transaction</text>
<text x="40" y="82" font-size="16" fill="#71717a">Two separate updates. The server dies between them.</text>

<!-- Account A -->
<rect x="60" y="130" width="300" height="190" rx="18" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="210" y="178" text-anchor="middle" font-size="22" font-weight="600" fill="#18181b">🏦 Account A</text>
<g text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="44" font-weight="700">
  <text x="210" y="260" fill="#18181b">₹5,000<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" dur="9s" repeatCount="indefinite"/></text>
  <text x="210" y="260" fill="#e11d48" opacity="0">₹4,000<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.25;1" dur="9s" repeatCount="indefinite"/></text>
</g>
<text x="210" y="300" text-anchor="middle" font-size="16" fill="#71717a">sender</text>

<!-- Account B -->
<rect x="840" y="130" width="300" height="190" rx="18" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="990" y="178" text-anchor="middle" font-size="22" font-weight="600" fill="#18181b">🏦 Account B</text>
<text x="990" y="260" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="44" font-weight="700" fill="#18181b">₹2,000</text>
<text x="990" y="300" text-anchor="middle" font-size="16" fill="#71717a">receiver (still waiting…)</text>

<line x1="370" y1="225" x2="830" y2="225" stroke="#a8a29e" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/>

<!-- the money in flight -->
<g opacity="0">
  <circle cx="420" cy="225" r="30" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <text x="420" y="232" text-anchor="middle" font-size="18" font-weight="800" fill="#78350f">₹1K</text>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;170 0;170 0" keyTimes="0;0.3;0.5;1" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.3;0.54;0.56;1" dur="9s" repeatCount="indefinite"/>
</g>

<!-- crash -->
<g opacity="0" text-anchor="middle">
  <text x="600" y="250" font-size="96">⚡</text>
  <rect x="490" y="268" width="220" height="44" rx="10" fill="#e11d48"/>
  <text x="600" y="298" font-size="20" font-weight="800" fill="#fff">SERVER CRASH</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.56;1" dur="9s" repeatCount="indefinite"/>
</g>

<!-- steps -->
<g font-family="JetBrains Mono, Consolas, monospace" font-size="18">
  <g opacity="0">
    <rect x="60" y="360" width="1080" height="48" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="80" y="391" fill="#18181b">Step 1  UPDATE accounts SET balance = balance - 1000 WHERE id = 'A';   ✅ done</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.22;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect x="60" y="418" width="1080" height="48" rx="10" fill="#f4f4f5" stroke="#e4e4e7"/>
    <text x="80" y="449" fill="#71717a">Step 2  UPDATE accounts SET balance = balance + 1000 WHERE id = 'B';   ❌ never ran</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.64;1" dur="9s" repeatCount="indefinite"/>
  </g>
</g>
<g opacity="0" text-anchor="middle">
  <text x="600" y="520" font-size="22" font-weight="700" fill="#e11d48">Total before: ₹7,000  →  Total after: ₹6,000.  ₹1,000 just vanished 😱</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.74;1" dur="9s" repeatCount="indefinite"/>
</g>
</svg>
