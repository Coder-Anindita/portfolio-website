<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#18181b"/>
<text x="600" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">Asking your math teacher a doubt be like:</text>

<rect x="30" y="100" width="560" height="490" rx="14" fill="#fff1f2"/>
<g text-anchor="middle">
  <text x="310" y="160" font-size="22" font-weight="600" fill="#18181b">🙋 "Ma'am, I have a doubt."</text>
  <text x="310" y="196" font-size="18" font-style="italic" fill="#52525b">*drops the entire 600-page textbook on her desk*</text>
  <text x="310" y="360" font-size="130">😵</text>
  <text x="310" y="420" font-size="20" fill="#52525b">teacher, flipping pages for 45 minutes</text>
  <rect x="80" y="480" width="460" height="64" rx="12" fill="#e11d48"/>
  <text x="310" y="521" font-size="22" font-weight="700" fill="#fff">❌ Sending the WHOLE PDF to the LLM</text>
</g>

<rect x="610" y="100" width="560" height="490" rx="14" fill="#ecfdf5"/>
<g text-anchor="middle">
  <text x="890" y="160" font-size="22" font-weight="600" fill="#18181b">🙋 "Ma'am, page 142, Q3 — this step?"</text>
  <text x="890" y="196" font-size="18" font-style="italic" fill="#52525b">*points at one paragraph*</text>
  <text x="890" y="360" font-size="130">😎</text>
  <text x="890" y="420" font-size="20" fill="#52525b">teacher, explaining it in 2 minutes</text>
  <rect x="660" y="480" width="460" height="64" rx="12" fill="#0f766e"/>
  <text x="890" y="521" font-size="22" font-weight="700" fill="#fff">✅ Semantic search → relevant pages</text>
</g>
</svg>
