<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Where does a write actually go?</text>
<text x="40" y="82" font-size="16" fill="#71717a">Data passes through several layers of memory before it's really on disk.</text>

<g text-anchor="middle">
  <rect x="40" y="160" width="190" height="120" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="135" y="210" font-size="34">🧑‍💻</text><text x="135" y="250" font-size="18" font-weight="700" fill="#18181b">Your app</text>

  <rect x="280" y="160" width="190" height="120" rx="16" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="375" y="210" font-size="34">🗄️</text><text x="375" y="250" font-size="18" font-weight="700" fill="#18181b">Database memory</text>

  <rect x="520" y="160" width="190" height="120" rx="16" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="615" y="210" font-size="34">🖥️</text><text x="615" y="250" font-size="18" font-weight="700" fill="#18181b">OS cache</text>

  <rect x="760" y="160" width="190" height="120" rx="16" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="855" y="210" font-size="34">⚡</text><text x="855" y="250" font-size="18" font-weight="700" fill="#18181b">Disk's own cache</text>

  <rect x="1000" y="160" width="160" height="120" rx="16" fill="#0f766e"/>
  <text x="1080" y="210" font-size="34">💽</text><text x="1080" y="250" font-size="18" font-weight="700" fill="#fff">Disk storage</text>
</g>

<g stroke="#52525b" stroke-width="2.5" marker-end="url(#a)">
  <line x1="234" y1="220" x2="272" y2="220"/><line x1="474" y1="220" x2="512" y2="220"/>
  <line x1="714" y1="220" x2="752" y2="220"/><line x1="954" y1="220" x2="992" y2="220"/>
</g>

<path d="M280 305 L280 320 L950 320 L950 305" fill="none" stroke="#e11d48" stroke-width="2.5"/>
<text x="615" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#e11d48">🔌 Lost on a power cut</text>
<path d="M1000 305 L1000 320 L1160 320 L1160 305" fill="none" stroke="#0f766e" stroke-width="2.5"/>
<text x="1080" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">✅ Survives</text>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="700">
  <line x1="300" y1="410" x2="690" y2="410" stroke="#52525b" stroke-width="3" marker-end="url(#a)"/>
  <text x="300" y="398" fill="#52525b">write()</text>
  <text x="700" y="415" font-family="Inter, Segoe UI, sans-serif" font-weight="500" font-size="15" fill="#52525b">stops here, returns "done"</text>
  <line x1="300" y1="470" x2="1150" y2="470" stroke="#0f766e" stroke-width="3" marker-end="url(#t)"/>
  <text x="300" y="458" fill="#0f766e">fsync()</text>
  <text x="430" y="458" font-family="Inter, Segoe UI, sans-serif" font-weight="500" font-size="15" fill="#0f766e">pushes it all the way, then returns</text>
</g>
<text x="600" y="530" text-anchor="middle" font-size="16" fill="#52525b">A database only says "COMMIT OK" after fsync. Good server disks have power-loss protection for their own cache.</text>
</svg>
