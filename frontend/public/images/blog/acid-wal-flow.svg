<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Write-Ahead Logging: write the diary first, the data later</text>
<text x="40" y="82" font-size="16" fill="#71717a">The log hits disk before COMMIT returns. The actual table files catch up later.</text>

<!-- boxes -->
<rect x="40" y="130" width="230" height="140" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="155" y="185" text-anchor="middle" font-size="40">🧑‍💻</text>
<text x="155" y="225" text-anchor="middle" font-size="20" font-weight="600" fill="#18181b">Your app</text>
<text x="155" y="250" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#71717a">UPDATE … ; COMMIT;</text>

<rect x="470" y="130" width="300" height="140" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="620" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#4338ca">⚡ Buffer pool (RAM)</text>
<text x="620" y="215" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#18181b">page: A = ₹4,000 (dirty)</text>
<text x="620" y="245" text-anchor="middle" font-size="15" fill="#71717a">fast, but gone on power cut</text>

<rect x="300" y="380" width="340" height="170" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="470" y="425" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">📒 WAL file (disk)</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#18181b">
  <text x="325" y="460">#101 tx 735 A: 5000 → 4000</text>
  <text x="325" y="484">#102 tx 735 B: 2000 → 3000</text>
  <text x="325" y="508" font-weight="700" fill="#0f766e">#103 tx 735 COMMIT</text>
</g>
<text x="470" y="537" text-anchor="middle" font-size="14" fill="#71717a">append-only = sequential = fast</text>

<rect x="830" y="380" width="330" height="170" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="995" y="425" text-anchor="middle" font-size="20" font-weight="700" fill="#18181b">🗄️ Data files (disk)</text>
<text x="995" y="465" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#18181b">accounts table</text>
<text x="995" y="495" text-anchor="middle" font-size="15" fill="#71717a">random writes, slow</text>
<text x="995" y="520" text-anchor="middle" font-size="15" fill="#71717a">updated lazily at checkpoint</text>

<!-- arrows -->
<g stroke="#52525b" stroke-width="2.5" fill="none" marker-end="url(#a)">
  <line x1="275" y1="180" x2="462" y2="180"/>
  <path d="M560 275 C 540 330, 500 340, 480 372"/>
  <path d="M300 440 C 200 420, 150 340, 150 280"/>
  <path d="M770 230 C 900 260, 990 300, 995 372"/>
</g>

<!-- step badges (animated highlight) -->
<g font-size="15" font-weight="700">
  <g><circle cx="368" cy="160" r="16" fill="#18181b"/><text x="368" y="166" text-anchor="middle" fill="#fff">1</text>
    <text x="300" y="214" fill="#18181b">change page in RAM</text>
    <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.02;0.2;0.22;1" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0.3"><circle cx="540" cy="330" r="16" fill="#0f766e"/><text x="540" y="336" text-anchor="middle" fill="#fff">2</text>
    <text x="566" y="336" fill="#0f766e">append log record + fsync</text>
    <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.22;0.24;0.42;0.44;1" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0.3"><circle cx="190" cy="350" r="16" fill="#0f766e"/><text x="190" y="356" text-anchor="middle" fill="#fff">3</text>
    <text x="40" y="320" fill="#0f766e">"COMMIT OK" ✅</text>
    <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.44;0.46;0.64;0.66;1" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0.3"><circle cx="930" cy="290" r="16" fill="#52525b"/><text x="930" y="296" text-anchor="middle" fill="#fff">4</text>
    <text x="956" y="296" fill="#52525b">later: checkpoint flush</text>
    <animate attributeName="opacity" values="0.3;0.3;1;1;0.3" keyTimes="0;0.66;0.68;0.98;1" dur="10s" repeatCount="indefinite"/></g>
</g>

<text x="600" y="605" text-anchor="middle" font-size="18" font-weight="600" fill="#18181b">💥 Crash after step 3? On restart the DB replays the WAL from the last checkpoint. Nothing committed is lost.</text>
</svg>
