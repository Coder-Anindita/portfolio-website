<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern></defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">No isolation: two buyers, two iPhones left</text>
<text x="40" y="82" font-size="16" fill="#71717a">Stock is 2. Both buyers check out at the same moment. Each does "read stock, subtract 1, write back".</text>

<!-- lanes -->
<text x="60" y="150" font-size="20" font-weight="700" fill="#0f766e">🧍 Buyer 1 (T1)</text>
<text x="60" y="440" font-size="20" font-weight="700" fill="#4338ca">🧍‍♀️ Buyer 2 (T2)</text>
<line x1="60" y1="290" x2="1140" y2="290" stroke="#d6d3d1" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="470" y="262" width="260" height="56" rx="12" fill="#18181b"/>
<text x="600" y="282" text-anchor="middle" font-size="13" fill="#a1a1aa">row: iphone_stock</text>
<g text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="20" font-weight="700">
  <text x="600" y="307" fill="#fff">stock = 2<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="10s" repeatCount="indefinite"/></text>
  <text x="600" y="307" fill="#fbbf24" opacity="0">stock = 1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.51;1" dur="10s" repeatCount="indefinite"/></text>
</g>
<text x="760" y="300" font-size="15" fill="#71717a">time →</text>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="17">
  <g opacity="0"><rect x="60" y="175" width="300" height="60" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><text x="80" y="212" fill="#18181b">① read stock → 2</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.1;1" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="250" y="340" width="300" height="60" rx="10" fill="#eef2ff" stroke="#c7d2fe"/><text x="270" y="377" fill="#18181b">② read stock → 2</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.27;1" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="520" y="175" width="320" height="60" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><text x="540" y="212" fill="#18181b">③ write stock = 2-1 = 1</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.44;1" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="800" y="340" width="340" height="60" rx="10" fill="#eef2ff" stroke="#c7d2fe"/><text x="820" y="377" fill="#18181b">④ write stock = 2-1 = 1</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.6;1" dur="10s" repeatCount="indefinite"/></g>
</g>

<g opacity="0">
  <rect x="60" y="470" width="1080" height="100" rx="14" fill="#e11d48"/>
  <text x="600" y="512" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">2 iPhones sold, stock only went down by 1 🤯</text>
  <text x="600" y="548" text-anchor="middle" font-size="18" fill="#ffe4e6">T2 overwrote T1's update without ever seeing it. That's a LOST UPDATE.</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.72;1" dur="10s" repeatCount="indefinite"/>
</g>
</svg>
