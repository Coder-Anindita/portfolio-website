<text x="1080" y="460" text-anchor="middle" font-size="13" font-style="italic" fill="#0f766e">swapping live…</text>

<text x="600" y="545" text-anchor="middle" font-size="20" fill="#3f3f46">Swap any block. The rest of your code doesn't even notice.</text>
