  <rect x="35" y="200" width="170" height="44" rx="10"/><rect x="35" y="258" width="170" height="44" rx="10"/><rect x="35" y="316" width="170" height="44" rx="10"/>
  <rect x="275" y="200" width="170" height="44" rx="10"/><rect x="275" y="258" width="170" height="44" rx="10"/><rect x="275" y="316" width="170" height="44" rx="10"/>
