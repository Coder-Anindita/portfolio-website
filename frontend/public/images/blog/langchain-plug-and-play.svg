<!-- selected pieces -->
<g fill="none" stroke="#0f766e" stroke-width="3">
  <rect x="35" y="200" width="170" height="44" rx="10"/><rect x="275" y="200" width="170" height="44" rx="10"/>
  <rect x="515" y="200" width="170" height="44" rx="10"/><rect x="755" y="200" width="170" height="44" rx="10"/>
