  <text x="120" y="227">PyPDFLoader</text><text x="120" y="285">WebBaseLoader</text><text x="120" y="343">CSVLoader</text>
  <text x="360" y="227">Recursive</text><text x="360" y="285">Token</text><text x="360" y="343">MarkdownHeader</text>
