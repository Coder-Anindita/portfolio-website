<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="600" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#18181b">PDFBuddy — the 10,000-ft view</text>

