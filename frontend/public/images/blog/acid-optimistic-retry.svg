<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Conflict detection: try, check, retry</text>
<text x="40" y="82" font-size="16" fill="#71717a">No waiting up front. If someone changed the row first, you start again with fresh data.</text>

<g text-anchor="middle">
  <rect x="40" y="200" width="220" height="110" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="150" y="243" font-size="19" font-weight="700" fill="#18181b">1. Read the row</text>
  <text x="150" y="275" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#52525b">stock 2, version 7</text>

  <rect x="320" y="200" width="250" height="110" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="445" y="243" font-size="19" font-weight="700" fill="#18181b">2. Write, only if</text>
  <text x="445" y="275" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#52525b">version is still 7</text>

  <polygon points="760,160 900,255 760,350 620,255" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="760" y="248" font-size="18" font-weight="700" fill="#18181b">1 row</text>
  <text x="760" y="272" font-size="18" font-weight="700" fill="#18181b">updated?</text>

  <rect x="960" y="200" width="200" height="110" rx="16" fill="#0f766e"/>
  <text x="1060" y="248" font-size="22" font-weight="700" fill="#fff">✅ Done</text>
  <text x="1060" y="278" font-size="15" fill="#ccfbf1">version is now 8</text>

  <rect x="560" y="430" width="400" height="110" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="760" y="472" font-size="19" font-weight="700" fill="#e11d48">0 rows: someone changed it first</text>
  <text x="760" y="505" font-size="16" fill="#52525b">throw away this attempt</text>
</g>

<g stroke="#52525b" stroke-width="2.5" fill="none" marker-end="url(#a)">
  <line x1="264" y1="255" x2="312" y2="255"/>
  <line x1="574" y1="255" x2="612" y2="255"/>
  <line x1="904" y1="255" x2="952" y2="255"/>
  <line x1="760" y1="354" x2="760" y2="422"/>
  <path d="M556 485 L150 485 L150 318"/>
</g>
<g font-size="16" font-weight="700">
  <text x="912" y="243" fill="#0f766e">yes</text>
  <text x="772" y="395" fill="#e11d48">no</text>
  <text x="200" y="475" fill="#52525b">retry from step 1 (with a limit)</text>
</g>
<text x="600" y="580" text-anchor="middle" font-size="16" fill="#52525b">Serializable works the same way: on "could not serialize access", run the whole transaction again.</text>
</svg>
