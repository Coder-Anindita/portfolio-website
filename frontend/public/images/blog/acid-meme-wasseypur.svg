<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#18181b"/>
<text x="600" y="62" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">When the money leaves your account but never reaches your friend:</text>

<rect x="30" y="100" width="560" height="330" rx="14" fill="#fff1f2"/>
<g text-anchor="middle">
  <text x="310" y="150" font-size="20" font-weight="600" fill="#71717a">📱 Your phone</text>
  <rect x="80" y="180" width="460" height="110" rx="14" fill="#fff" stroke="#fecdd3" stroke-width="2"/>
  <text x="310" y="225" font-size="22" font-weight="700" fill="#e11d48">₹1,000 debited from A/c XX1234</text>
  <text x="310" y="260" font-size="17" fill="#71717a">Txn ref 4417… · just now</text>
  <text x="310" y="390" font-size="80">💸</text>
</g>

<rect x="610" y="100" width="560" height="330" rx="14" fill="#f4f4f5"/>
<g text-anchor="middle">
  <text x="890" y="150" font-size="20" font-weight="600" fill="#71717a">📱 Your friend's phone</text>
  <rect x="660" y="180" width="460" height="110" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="890" y="225" font-size="22" font-weight="700" fill="#52525b">bhai paise nahi aaye 🤨</text>
  <text x="890" y="260" font-size="17" fill="#71717a">no credit · 3 hours later</text>
  <text x="890" y="390" font-size="80">🤷</text>
</g>

<g text-anchor="middle">
  <text x="600" y="505" font-size="44" font-weight="800" fill="#fbbf24">"Ye dukh kaahe khatam nahi hota be!" 😩</text>
  <text x="600" y="560" font-size="20" fill="#a1a1aa">— every bank customer in a world without transactions (Gangs of Wasseypur energy)</text>
</g>
</svg>
