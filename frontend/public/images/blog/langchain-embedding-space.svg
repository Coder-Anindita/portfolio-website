<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  <marker id="q" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>

<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">The "meaning map" (embeddings squashed to 2D)</text>
<text x="40" y="80" font-size="15" fill="#71717a">Real embeddings live in 384–3072 dimensions. Similar meaning → nearby points → small angle.</text>

<!-- axes -->
<g stroke="#a8a29e" stroke-width="2">
  <line x1="90" y1="620" x2="760" y2="620"/><line x1="90" y1="620" x2="90" y2="110"/>
</g>
<text x="760" y="645" text-anchor="end" font-size="14" fill="#a8a29e">dimension 1</text>
<text x="100" y="118" font-size="14" fill="#a8a29e">dimension 2</text>

<!-- cluster halos -->
<ellipse cx="320" cy="250" rx="170" ry="110" fill="#ccfbf1" opacity="0.5"/>
<text x="180" y="160" font-size="14" font-weight="600" fill="#0f766e">sports</text>
<ellipse cx="620" cy="500" rx="110" ry="70" fill="#fef3c7" opacity="0.7"/>
<text x="560" y="445" font-size="14" font-weight="600" fill="#b45309">food</text>
<ellipse cx="200" cy="500" rx="90" ry="55" fill="#e0e7ff" opacity="0.7"/>
<text x="130" y="460" font-size="14" font-weight="600" fill="#4338ca">tech</text>

<!-- vectors from origin (animated) -->
<g stroke-width="2.5" opacity="0">
  <line x1="90" y1="620" x2="236" y2="208" stroke="#0f766e" marker-end="url(#a)"/>
  <line x1="90" y1="620" x2="424" y2="324" stroke="#0f766e" marker-end="url(#a)"/>
  <line x1="90" y1="620" x2="264" y2="224" stroke="#d97706" stroke-dasharray="7 5" marker-end="url(#q)"/>  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.35;0.9;1" dur="7s" repeatCount="indefinite"/>
</g>

<!-- points -->
<g font-size="15" fill="#18181b">
  <circle cx="240" cy="200" r="7" fill="#0f766e"/><text x="140" y="192">🏏 Virat is a batting legend</text>
  <circle cx="320" cy="270" r="7" fill="#0f766e"/><text x="332" y="275">🏏 Dhoni finishes matches</text>
  <circle cx="430" cy="320" r="7" fill="#0f766e"/><text x="442" y="325">⚽ Messi's stunning free kick</text>
  <circle cx="600" cy="520" r="7" fill="#d97706"/><text x="612" y="525">🍛 Biryani recipe</text>
  <circle cx="660" cy="480" r="7" fill="#d97706"/><text x="606" y="470">🍰 Bake a cake</text>
  <circle cx="200" cy="510" r="7" fill="#4338ca"/><text x="212" y="515">💻 Laptop battery tips</text>
</g>

<!-- winner ring -->
<circle cx="240" cy="200" r="16" fill="none" stroke="#0f766e" stroke-width="3" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.65;0.9;1" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="r" values="14;22;14" dur="1s" repeatCount="indefinite"/>
</circle>

<!-- query star -->
<g opacity="0">
  <text x="268" y="236" text-anchor="middle" font-size="26">⭐</text>
  <rect x="290" y="206" width="240" height="32" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="302" y="228" font-size="15" font-weight="600" fill="#92400e">❓ Who is a great cricketer?</text>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.2;0.9;1" dur="7s" repeatCount="indefinite"/>
</g>

<!-- similarity panel -->
<rect x="800" y="130" width="370" height="380" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
<text x="824" y="172" font-size="20" font-weight="700" fill="#18181b">Cosine similarity to the query</text>
<g font-size="15" fill="#3f3f46">
  <text x="824" y="222">🏏 Virat is a batting legend</text>
  <rect x="824" y="232" width="0" height="24" rx="6" fill="#0f766e"><animate attributeName="width" values="0;0;317;317;0" keyTimes="0;0.4;0.55;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
  <text x="824" y="302">⚽ Messi's stunning free kick</text>
  <rect x="824" y="312" width="0" height="24" rx="6" fill="#5eead4"><animate attributeName="width" values="0;0;243;243;0" keyTimes="0;0.4;0.55;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
  <text x="824" y="382">🍛 Biryani recipe</text>
  <rect x="824" y="392" width="0" height="24" rx="6" fill="#fbbf24"><animate attributeName="width" values="0;0;13;13;0" keyTimes="0;0.4;0.55;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="600" text-anchor="end" fill="#18181b">
  <text x="1150" y="222">0.99</text><text x="1150" y="302">0.76</text><text x="1150" y="382">0.04</text>
</g>
<text x="824" y="470" font-size="15" fill="#0f766e" font-weight="600">→ Winner: the Virat chunk goes to the LLM</text>
</svg>
