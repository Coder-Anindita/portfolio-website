<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#18181b"/>
<text x="600" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">The database, right after it says COMMIT OK:</text>

<rect x="30" y="100" width="1140" height="330" rx="14" fill="#f0fdfa"/>
<g text-anchor="middle">
  <text x="210" y="320" font-size="160">😎</text>
  <text x="730" y="210" font-size="40" font-weight="800" fill="#18181b">"Ek baar jo maine commitment</text>
  <text x="730" y="265" font-size="40" font-weight="800" fill="#18181b">kar di, uske baad toh main</text>
  <text x="730" y="320" font-size="40" font-weight="800" fill="#0f766e">khud ki bhi nahi sunta."</text>
  <text x="730" y="385" font-size="20" fill="#52525b">— Wanted, and every durable database</text>
</g>

<g text-anchor="middle" font-size="24" font-weight="700">
  <rect x="30" y="455" width="360" height="110" rx="14" fill="#27272a"/>
  <text x="210" y="505" fill="#fff">🔌 Power cut?</text><text x="210" y="540" font-size="18" font-weight="500" fill="#5eead4">still there</text>
  <rect x="420" y="455" width="360" height="110" rx="14" fill="#27272a"/>
  <text x="600" y="505" fill="#fff">💥 Process crash?</text><text x="600" y="540" font-size="18" font-weight="500" fill="#5eead4">still there</text>
  <rect x="810" y="455" width="360" height="110" rx="14" fill="#27272a"/>
  <text x="990" y="505" fill="#fff">🔁 Reboot?</text><text x="990" y="540" font-size="18" font-weight="500" fill="#5eead4">still there</text>
</g>
</svg>
