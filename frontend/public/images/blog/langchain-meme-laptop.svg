<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#18181b"/>
<text x="600" y="60" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">Me: "I'll just run a 70B model on my laptop."</text>

<rect x="30" y="95" width="560" height="475" rx="14" fill="#fff7ed"/>
<g text-anchor="middle">
  <text x="310" y="145" font-size="24" font-weight="700" fill="#18181b">My laptop:</text>
  <text x="310" y="300" font-size="120">
    🔥💻🔥
    <animate attributeName="font-size" values="120;128;120" dur="0.4s" repeatCount="indefinite"/>
  </text>
  <text x="310" y="380" font-size="20" fill="#3f3f46">"You want me to hold ~140 GB of weights?</text>
  <text x="310" y="410" font-size="20" fill="#3f3f46">I have 8 GB of RAM and a dream."</text>
  <rect x="80" y="470" width="460" height="64" rx="12" fill="#ea580c"/>
  <text x="310" y="511" font-size="22" font-weight="700" fill="#fff">Self-hosting: heavy, expensive</text>
</g>

<rect x="610" y="95" width="560" height="475" rx="14" fill="#f0fdfa"/>
<g text-anchor="middle">
  <text x="890" y="145" font-size="24" font-weight="700" fill="#18181b">OpenAI · Google · Anthropic:</text>
  <text x="890" y="300" font-size="120">☁️🤝</text>
  <text x="890" y="380" font-size="20" fill="#3f3f46">"Relax. We run the GPUs.</text>
  <text x="890" y="410" font-size="20" fill="#3f3f46">You send text, we send text back."</text>
  <rect x="660" y="470" width="460" height="64" rx="12" fill="#0f766e"/>
  <text x="890" y="511" font-size="22" font-weight="700" fill="#fff">LLM via API: one HTTP call</text>
</g>
</svg>
