<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  <marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4338ca"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18181b">Plain HTTP: everyone on the path can read it</text>
<text x="40" y="82" font-size="16" fill="#71717a">Your request hops through Wi-Fi routers, ISPs and other networks. Without encryption, each one sees plain text.</text>
<g text-anchor="middle">
  <rect x="40" y="140" width="220" height="120" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="150" y="188" font-size="34">👩‍💻</text><text x="150" y="226" font-size="20" font-weight="700" fill="#18181b">Pam</text><text x="150" y="248" font-size="14" fill="#71717a">browser</text>
  <rect x="940" y="140" width="220" height="120" rx="16" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="1050" y="188" font-size="34">🖥️</text><text x="1050" y="226" font-size="20" font-weight="700" fill="#18181b">Jim</text><text x="1050" y="248" font-size="14" fill="#71717a">server</text>
</g>
<line x1="260" y1="200" x2="936" y2="200" stroke="#52525b" stroke-width="3" marker-end="url(#a)"/>
<rect x="370" y="172" width="460" height="56" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="600" y="206" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="17" fill="#18181b">POST /login  password=hunter2</text>
<line x1="600" y1="228" x2="600" y2="318" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="490" y="320" width="220" height="80" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="600" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#18181b">🕵️ Hacker</text>
<text x="600" y="380" text-anchor="middle" font-size="14" fill="#71717a">on the same café Wi-Fi</text>
<text x="730" y="366" font-size="17" font-weight="600" fill="#e11d48">“hunter2? Nice password.” 👀</text>
<rect x="40" y="430" width="1120" height="64" rx="14" fill="#18181b"/>
<text x="600" y="469" text-anchor="middle" font-size="18" font-weight="600" fill="#fff">Problem 1: the hacker can read everything. Problem 2: they can change it, and nobody would notice.</text>
</svg>
