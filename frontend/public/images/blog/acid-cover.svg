<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Segoe UI, system-ui, sans-serif">
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e7e5e4"/></pattern></defs>
<rect width="100%" height="100%" fill="#fafaf9"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="600" y="120" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="4" fill="#0f766e">DATABASES, WITHOUT THE JARGON</text>
<text x="600" y="200" text-anchor="middle" font-size="62" font-weight="700" fill="#18181b">ACID: four promises</text>
<text x="600" y="252" text-anchor="middle" font-size="26" fill="#52525b">that keep your ₹1000 from vanishing mid-transfer</text>

<g text-anchor="middle">
  <rect x="60" y="320" width="250" height="250" rx="20" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="185" y="410" font-size="84" font-weight="800" fill="#0f766e">A</text>
  <text x="185" y="470" font-size="26" font-weight="600" fill="#18181b">Atomicity</text>
  <text x="185" y="510" font-size="18" fill="#71717a">all or nothing</text>
  <text x="185" y="548" font-size="28">⚛️</text>

  <rect x="340" y="320" width="250" height="250" rx="20" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="465" y="410" font-size="84" font-weight="800" fill="#d97706">C</text>
  <text x="465" y="470" font-size="26" font-weight="600" fill="#18181b">Consistency</text>
  <text x="465" y="510" font-size="18" fill="#71717a">rules are rules</text>
  <text x="465" y="548" font-size="28">📏</text>

  <rect x="620" y="320" width="250" height="250" rx="20" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
  <text x="745" y="410" font-size="84" font-weight="800" fill="#4338ca">I</text>
  <text x="745" y="470" font-size="26" font-weight="600" fill="#18181b">Isolation</text>
  <text x="745" y="510" font-size="18" fill="#71717a">no peeking</text>
  <text x="745" y="548" font-size="28">🚧</text>

  <rect x="900" y="320" width="250" height="250" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1025" y="410" font-size="84" font-weight="800" fill="#e11d48">D</text>
  <text x="1025" y="470" font-size="26" font-weight="600" fill="#18181b">Durability</text>
  <text x="1025" y="510" font-size="18" fill="#71717a">commit = forever</text>
  <text x="1025" y="548" font-size="28">💾</text>
</g>
<text x="600" y="630" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#71717a">BEGIN; … COMMIT;</text>
</svg>
